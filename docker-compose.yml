# NOTE: configuration only - not built/run in the development environment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: simjobs
      POSTGRES_USER: simrunner
      POSTGRES_PASSWORD: simrunner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simrunner -d simjobs"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://simrunner:simrunner@db:5432/simjobs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "simrunner.worker_main"]
    environment:
      DATABASE_URL: postgresql://simrunner:simrunner@db:5432/simjobs
    depends_on:
      db:
        condition: service_healthy
